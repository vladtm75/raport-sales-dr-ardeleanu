// Helpers — period total per category
const CIDX = () => 11 + ACT_MO;   // indexul lunii selectate in CAT_MONTHS (Ian 26 = 12)
const catVal = (key, period) => {
  const a = CAT_DATA[key], ci = CIDX();
  if (period === 'Month') return a[ci];
  let s = 0; for (let i = 12; i <= ci; i++) s += a[i]; return s;   // YTD Ian - luna selectata
};
const catYoY = (key) => { const a = CAT_DATA[key], ci = CIDX(); return ci >= 12 ? gr(a[ci], a[ci-12]) : null; };
// Mix share (% of total network) at a given month index
const catShare = (key, monthIdx) => {
  const monthTotal = CAT_LIST.reduce((s,c) => s + CAT_DATA[c.key][monthIdx], 0);
  return monthTotal ? CAT_DATA[key][monthIdx] / monthTotal * 100 : 0;
};
// Δ pondere YoY (Apr 26 share − Apr 25 share, in percentage points)
const catSumRange = (key, a0, a1) => { const a = CAT_DATA[key]; let s = 0; for (let i = a0; i <= a1; i++) s += (a[i] || 0); return s; };
const catShareYTD = (key, y26) => { const ci = CIDX(); const a0 = y26 ? 12 : 0, a1 = y26 ? ci : ci - 12; const tot = CAT_LIST.reduce((s, c) => s + catSumRange(c.key, a0, a1), 0); return tot ? catSumRange(key, a0, a1) / tot * 100 : 0; };
const catShareDeltaYoY = (key, period) => period === 'YTD' ? catShareYTD(key, true) - catShareYTD(key, false) : catShare(key, CIDX()) - catShare(key, CIDX() - 12);

// ─── Helpers ──────────────────────────────────────────────────────────────────
const sum  = (arr) => (arr||[]).reduce((a,b)=>a+(b||0),0);
const ytd  = (arr,n) => sum((arr||[]).slice(0,n));
const gr   = (a,b) => (b&&b!==0) ? ((a-b)/b)*100 : null;
const fmt  = (v) => {
  if(v==null||isNaN(v)) return '—';
  if(Math.abs(v)>=1e6) return (v/1e6).toFixed(2)+'M';
  if(Math.abs(v)>=1e3) return (v/1e3).toFixed(0)+'K';
  return v.toFixed(0);
};
const pct  = (v) => v==null ? '—' : (v>0?'+':'')+v.toFixed(1)+'%';
const pct0 = (v) => v==null ? '—' : (v>0?'+':'')+Math.round(v)+'%';
const pcol = (v) => v==null ? P.muted : v>=10 ? '#2D7D46' : v>=0 ? '#5A9E6B' : P.alert;

const val = (clinic, yr, period) => {
  const a = clinic.actuals?.[yr]; if(!a) return null;
  if (period==='Month') return a[ACT_MO-1];
  if (period==='YTD') {
    const slice = a.slice(0, ACT_MO);
    if (slice.every(x=>x==null)) return null;
    return slice.reduce((s,v)=>s+(v||0),0);
  }
  const nonNull = a.filter(x=>x!==null);
  return nonNull.length ? sum(nonNull) : null;
};
const bval = (clinic, yr, period) => {
  const a = clinic.budget?.[yr]; if(!a||a.every(x=>x==null)) return null;
  if (period==='Month') return a[ACT_MO-1];
  if (period==='Annual') return sum(a.filter(x=>x!==null));
  return ytd(a, ACT_MO);
};
const netv = (period) => {
  const a=NET.actuals[2026];
  return period==='Month'?a[ACT_MO-1]:period==='YTD'?ytd(a,ACT_MO):sum(a.filter(x=>x!==null));
};
const netb = (period) => {
  const a=NET.budget[2026];
  return period==='Month'?a[ACT_MO-1]:period==='YTD'?ytd(a,ACT_MO):sum(a);
};
const pLabel = (p) => p==='Month'?MONTHS[ACT_MO-1]+' 2026':p==='YTD'?'YTD Ian–'+MONTHS[ACT_MO-1]+' 2026':'Full Year';

const KPI = ({label,value,sub,subColor,sub2,sub2Color,hi,delta}) => {
  const deltaPos = delta === true;
  const deltaNeg = delta === false;
  const deltaBg = deltaPos ? 'rgba(21,128,61,0.05)' : deltaNeg ? 'rgba(217,48,37,0.05)' : null;
  const deltaBorder = deltaPos ? '#15803D' : deltaNeg ? P.alert : null;
  return (
  <div style={{
    background: hi ? P.primary : deltaBg || P.white,
    border: `1px solid ${hi ? P.primary : deltaBorder || P.border}`,
    borderLeft: deltaBorder ? `3px solid ${deltaBorder}` : undefined,
    borderRadius: 10, padding: '15px 17px',
    boxShadow: hi ? '0 2px 10px rgba(123,28,22,0.18)' : deltaPos ? '0 1px 6px rgba(21,128,61,0.10)' : deltaNeg ? '0 1px 6px rgba(217,48,37,0.10)' : '0 1px 3px rgba(0,0,0,0.04)',

    <div style={{fontSize:10,fontWeight:600,color:hi?'rgba(255,255,255,0.65)':P.muted,textTransform:'uppercase',letterSpacing:0.7,marginBottom:5}}>{label}</div>

    {sub&&<div style={{fontSize:11,color:subColor||(hi?'rgba(255,255,255,0.6)':P.muted),marginTop:5,fontWeight:500}}>{sub}</div>}
    {sub2&&<div style={{fontSize:11,color:sub2Color||(hi?'rgba(255,255,255,0.6)':P.muted),marginTop:2,fontWeight:600}}>{sub2}</div>}

                  color: row.isTotal?P.white : row.isDelta?(row.total>=0?'#15803D':P.alert) : row.isBudget?P.amber : P.primary,
                  background: row.isTotal?'transparent' : row.isDelta?(row.total>=0?'#DCFCE7':'#FEE2E2') : row.isBudget?'#FEF9EB':'#F9F4F4',
                }}>{row.total!=null ? (row.isDelta?(row.total>=0?'+':'')+fmt(row.total) : fmt(row.total)) : '—'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

function buildClinicDataRows(clinic) {
  const rows = [];
  const actYears = Object.keys(clinic.actuals).map(Number).sort();
  // Actuals per year
  actYears.forEach(yr => {
    const arr = clinic.actuals[yr];
    rows.push({
      label: `${yr} Actual`,
      isBudget: false,
      cells: MONTHS.map((_,i) => ({v: arr[i]??null})),
      total: arr.filter(x=>x!=null).length ? sum(arr.filter(x=>x!=null)) : null,
    });
  });
  // Budget 2026 if exists
  const bgt = clinic.budget?.[2026];
  if(bgt && !bgt.every(x=>x==null)) {
    rows.push({
      label: 'Budget 2026',
      isBudget: true,
      cells: MONTHS.map((_,i) => ({v: bgt[i]??null})),
      total: sum(bgt.filter(x=>x!=null)),
    });
    // Δ Actual vs Budget row
    const act2026 = clinic.actuals?.[2026];
    if(act2026) {
      const deltaVals = MONTHS.map((_,i) => {
        const a = act2026[i], b = bgt[i];
        return (a!=null && b!=null) ? a - b : null;
      });
      const deltaTotal = deltaVals.filter(x=>x!=null).length ? sum(deltaVals.filter(x=>x!=null)) : null;
      rows.push({
        label: 'Δ Actual vs Buget',
        isDelta: true,
        cells: MONTHS.map((_,i) => ({v: deltaVals[i]})),
        total: deltaTotal,
      });
    }
  }
  return rows;
}

function buildNetworkDataRows(period) {

  rows.push({

    cells: MONTHS.map((_,i) => ({v: NET.budget[2026][i]??null})),

  });
  // Δ Actual vs Budget

function buildClusterDataRows(codes) {
  const rows = [];
  [2023,2024,2025,2026].forEach(yr => {
    const totals = MONTHS.map((_,i) => codes.reduce((acc,c) => acc + (CD[c].actuals[yr]?.[i]||0), 0));
    const hasData = totals.some(v=>v>0);
    if(!hasData) return;
    rows.push({
      label: `${yr} Actual`,
      isBudget: false,
      cells: MONTHS.map((_,i) => ({v: totals[i]||null})),
      total: sum(totals.filter(v=>v>0)),
    });
  });
  // Budget 2026
  const bgtTotals = MONTHS.map((_,i) => codes.reduce((acc,c) => {
    const b = CD[c].budget?.[2026]; return acc + (b?.[i]||0);
  }, 0));
  if(bgtTotals.some(v=>v>0)) {
    rows.push({
      label: 'Budget 2026',
      isBudget: true,
      cells: MONTHS.map((_,i) => ({v: bgtTotals[i]||null})),
      total: sum(bgtTotals),
    });
    // Δ Actual vs Budget
    const act2026totals = MONTHS.map((_,i) => codes.reduce((acc,c) => acc + (CD[c].actuals[2026]?.[i]||0), 0));
    const deltaVals = MONTHS.map((_,i) => (act2026totals[i]>0 && bgtTotals[i]>0) ? act2026totals[i]-bgtTotals[i] : null);
    rows.push({
      label: 'Δ Actual vs Buget',
      isDelta: true,
      cells: MONTHS.map((_,i) => ({v: deltaVals[i]})),
      total: deltaVals.filter(x=>x!=null).length ? sum(deltaVals.filter(x=>x!=null)) : null,
    });
  }
  return rows;
}

  annual.push({year:'2026B',rev:sum(NET.budget[2026]),est:true});

    return {name:c.name,code:c.code,cl:c.cluster,v26,v25,g:gr(v26,v25),lflG,isLFL,hasAny2026};

// ─── Network Monthly History (embedded in Rețea tab) ─────────────────────────
// Reproduces the historical monthly sales trend from the MTD report ("Sales YTD
// Trend" chart). Built from the dashboard's own NET monthly actuals (facturat) so
// it stays fully consistent with every other tab.
function NetHistory() {
  const HIST_YEARS = [2022,2023,2024,2025,2026];
  const series = [];
  HIST_YEARS.forEach(yr => {
    const av = NET.actuals[yr]||[];
    const bv = NET.budget[yr]||null;
    MONTHS.forEach((_,i) => {
      const future2026 = (yr===2026 && i>=ACT_MO);   // Iun–Dec 2026: budget only
      const a = future2026 ? null : av[i];
      const b = bv ? bv[i] : null;
      // include a point if there's an actual, or it's a future 2026 month carrying a budget
      if (a==null && !(future2026 && b!=null)) return;
      const both = a!=null && b!=null;
      series.push({
        label:`${MONTHS[i]} ${String(yr).slice(2)}`, value:a, bud:b, year:yr, mi:i, proj:future2026,
        over:  both && a>=b ? [b,a] : null,   // favourable gap band (actual above budget)
        under: both && a<b  ? [a,b] : null,   // unfavourable gap band (actual below budget)
      });
    });
  });

  const actuals = series.filter(d=>d.value!=null);
  const latest  = actuals[actuals.length-1];                 // last actual month (Mai 26)
  const peak    = actuals.reduce((m,d)=>d.value>m.value?d:m, actuals[0]);
  const last12  = actuals.slice(-12);
  const avg12   = Math.round(last12.reduce((a,d)=>a+d.value,0)/last12.length);
  const prevYearSame = actuals.find(d=>d.year===latest.year-1 && d.mi===latest.mi);
  const yoyLatest = prevYearSame ? gr(latest.value, prevYearSame.value) : null;
  const latVsBud  = latest.bud ? gr(latest.value, latest.bud) : null;
  const fyBudget  = sum(NET.budget[2026]);
  const ytdA = NET.actuals[2026].slice(0,ACT_MO).reduce((s,v)=>s+(v||0),0);
  const ytdB = NET.budget[2026].slice(0,ACT_MO).reduce((s,v)=>s+(v||0),0);
  const ytdGap = ytdA - ytdB, ytdGapPct = gr(ytdA, ytdB);
  const yearStarts = series.filter(d=>d.mi===0);

  const Stat = ({k,v,vc}) => (
    <span style={{fontSize:11,color:P.muted}}><b style={{color:P.primary}}>{k}:</b> <span style={{color:vc||P.text,fontWeight:600}}>{v}</span></span>
  );

  // Dedicated tooltip — shows actual, budget and the gap (ecart) for the hovered month
  const HistTip = ({active,payload}) => {
    if(!active||!payload?.length) return null;
    const p = payload[0].payload;
    const gap = (p.value!=null && p.bud!=null) ? p.value-p.bud : null;
    const gc = gap==null ? P.muted : gap>=0 ? '#2D7D46' : P.alert;
    return <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:8,padding:'10px 14px',fontSize:11,boxShadow:'0 4px 16px rgba(0,0,0,0.10)',fontFamily:"'Poppins',sans-serif",minWidth:150}}>
      <div style={{fontWeight:700,marginBottom:5,color:P.primary,fontSize:12,fontFamily:"'Playfair Display',serif"}}>{p.label}{p.proj?' · proiecție':''}</div>
      {p.value!=null && <div style={{display:'flex',justifyContent:'space-between',gap:18,marginBottom:2}}><span style={{color:P.primary,fontWeight:500}}>Actual</span><b>{fmt(p.value)}</b></div>}
      {p.bud!=null && <div style={{display:'flex',justifyContent:'space-between',gap:18,marginBottom:2}}><span style={{color:P.amber,fontWeight:500}}>Buget</span><b>{fmt(p.bud)}</b></div>}
      {gap!=null && <div style={{display:'flex',justifyContent:'space-between',gap:18,marginTop:4,paddingTop:4,borderTop:`1px solid ${P.border}`}}><span style={{color:gc,fontWeight:600}}>Ecart</span><b style={{color:gc}}>{(gap>=0?'+':'')+fmt(gap)} ({pct(gr(p.value,p.bud))})</b></div>}
    </div>;
  };

  return (
    <Card style={{marginBottom:16}}>
      <Sec>Istoric Vânzări Lunare Rețea vs Buget — {series[0].label} → {series[series.length-1].label} (RON)</Sec>
      <div style={{display:'flex',gap:20,flexWrap:'wrap',marginBottom:12,paddingBottom:11,borderBottom:`1px solid ${P.border}`}}>
        <Stat k="Ultima lună actual" v={`${fmt(latest.value)} (${latest.label}, YoY ${pct0(yoyLatest)})`} vc={pcol(yoyLatest)}/>
        <Stat k={'Ecart vs Buget ('+latest.label+')'} v={`${latest.value-latest.bud>=0?'+':''}${fmt(latest.value-latest.bud)} (${pct(latVsBud)})`} vc={pcol(latVsBud)}/>
        <Stat k="Ecart YTD '26" v={`${ytdGap>=0?'+':''}${fmt(ytdGap)} (${pct(ytdGapPct)})`} vc={pcol(ytdGapPct)}/>
        <Stat k="Buget FY26" v={fmt(fyBudget)}/>
        <Stat k="Vârf istoric" v={`${fmt(peak.value)} (${peak.label})`}/>
      </div>
      <ResponsiveContainer width="100%" height={380}>
        <ComposedChart data={series} margin={{top:14,right:20,bottom:30,left:5}}>
          <CartesianGrid strokeDasharray="3 3" stroke="#F0F0F0" vertical={false}/>
          <XAxis dataKey="label" tick={{fontSize:9,fill:P.muted}} axisLine={false} tickLine={false}
                 interval={2} angle={-40} textAnchor="end" height={50}/>
          <YAxis tickFormatter={v=>(v/1e6).toFixed(1)+'M'} tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
          <Tooltip content={<HistTip/>}/>
          {yearStarts.map(ys=>(
            <ReferenceLine key={ys.year} x={ys.label} stroke="#E0E0E0" strokeDasharray="2 4"
              label={{value:`${ys.year}`,position:'top',fontSize:9,fill:P.muted}}/>
          ))}
          <ReferenceLine x={latest.label} stroke={P.primary} strokeOpacity={0.45} strokeDasharray="4 3"
            label={{value:'buget proiectat →',position:'insideTopRight',fontSize:9,fill:P.primary,fontWeight:600}}/>
          {/* Variance bands — the gap between budget and realised sales */}
          <Area type="monotone" dataKey="under" stroke="none" fill={P.alert} fillOpacity={0.34}
                name="Ecart nefavorabil" connectNulls={false} activeDot={false} isAnimationActive={false} legendType="none"/>
          <Area type="monotone" dataKey="over"  stroke="none" fill="#2D7D46" fillOpacity={0.28}
                name="Ecart favorabil"  connectNulls={false} activeDot={false} isAnimationActive={false} legendType="none"/>
          <Line type="monotone" dataKey="bud" stroke={P.amber} strokeWidth={2} dot={false}
                strokeDasharray="5 4" name="Buget" connectNulls={false}/>
          <Area type="monotone" dataKey="value" stroke={P.primary} strokeWidth={2.4}
                fill={P.primary} fillOpacity={0} name="Vânzări lunare" dot={false} connectNulls={false}
                activeDot={{r:5,fill:P.primary,stroke:P.white,strokeWidth:2}}/>
        </ComposedChart>
      </ResponsiveContainer>
      <Legend items={[[P.primary,'Vânzări (actual)'],[P.amber,'Buget',true],['#2D7D46','Ecart favorabil (peste buget)'],[P.alert,'Ecart nefavorabil (sub buget)']]}/>
      <div style={{fontSize:10,color:P.muted,marginTop:8,fontStyle:'italic',lineHeight:1.5}}>
        Banda colorată = ecartul lunar dintre vânzările realizate și buget (verde = peste buget, roșu = sub buget). Actuals (facturat) până în {latest.label}; bugetul continuă până în Dec 26.
        Sursă buget: fișierul de date (2023–2026; 2022 fără buget la nivel de rețea). Liniile verticale marchează începutul fiecărui an.
      </div>
    </Card>
  );
}

class SafeBox extends React.Component {
  constructor(p){ super(p); this.state = {err:false}; }
  static getDerivedStateFromError(){ return {err:true}; }
  render(){ return this.state.err ? <div style={{fontSize:11,color:'#888',padding:10}}>Secțiunea nu a putut fi afișată.</div> : this.props.children; }
}

function CategoryTab({period}) {
  // Period values are still useful for the snapshot bar chart and the table
  const rows = CAT_LIST.map(c => ({
    ...c,
    v:       catVal(c.key, period),
    yoy:     catYoY(c.key),
    sApr26:  period==='YTD' ? catShareYTD(c.key, true) : catShare(c.key, CIDX()),
    sApr25:  period==='YTD' ? catShareYTD(c.key, false) : catShare(c.key, CIDX()-12),
    dPP:     catShareDeltaYoY(c.key, period),
  })).sort((a,b) => b.v - a.v);
  const total = rows.reduce((s,r) => s + r.v, 0);
  rows.forEach(r => { r.pct = (r.v / total) * 100; });

  // Headline mix metrics — urmeaza luna selectata
  const shNow = (k) => period==='YTD' ? catShareYTD(k, true) : catShare(k, CIDX());
  const shPrev = (k) => period==='YTD' ? catShareYTD(k, false) : catShare(k, CIDX()-12);
  const sIMP = shNow('IMP'), sPRO = shNow('PRO');
  const sTOD = shNow('TOD'), sEND = shNow('END');
  const sCON = shNow('CON'), sEST = shNow('ESD')+shNow('ESF');
  const dTOD = catShareDeltaYoY('TOD', period);
  const dIMP = catShareDeltaYoY('IMP', period);
  const dPRO = catShareDeltaYoY('PRO', period);
  const dEND = catShareDeltaYoY('END', period);
  // Implant mix correction Mar→Apr (real mix shift, not network expansion)
  const sIMPmar = catShare('IMP', CIDX()-1);
  const dIMPmom = sIMP - sIMPmar;

  // Top 4 mix-share trend across full 13-month window
  const top4Keys   = ['IMP','PRO','TOD','END'];
  const top4Names  = top4Keys.map(k => CAT_LIST.find(c=>c.key===k).name);
  const top4Colors = top4Keys.map(k => CAT_LIST.find(c=>c.key===k).color);
  const trend = CAT_MONTHS.map((m,i) => {
    const o = {month:m};
    top4Keys.forEach(k => { o[k] = +catShare(k, i).toFixed(1); });
    return o;
  });

  // Color helper for percentage-point delta
  const dCol = (d) => d == null ? P.muted : d > 0.5 ? '#2D7D46' : d < -0.5 ? P.alert : P.muted;
  const dFmt = (d) => d == null ? '—' : (d > 0 ? '+' : '') + d.toFixed(1) + 'pp';

  // Fereastra de date mix: CAT_MONTHS (Apr 25 -> Iul 26); indexarea urmeaza luna selectata (CIDX).
  const catPLabel = period==='Month' ? MONTHS[ACT_MO-1]+' 2026' : 'YTD Ian–'+MONTHS[ACT_MO-1]+' 2026';


  return <div>
    {/* KPI Strip — mix-share lens */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:20}}>
      <KPI hi label={`#1 — ${rows[0].name}`} value={fmt(rows[0].v)} sub={`${rows[0].pct.toFixed(1)}% din total · ${catPLabel}`}/>
      <KPI    label={`#2 — ${rows[1].name}`} value={fmt(rows[1].v)} sub={`${rows[1].pct.toFixed(1)}% din total`}/>
      <KPI    label={`#3 — ${rows[2].name}`} value={fmt(rows[2].v)} sub={`${rows[2].pct.toFixed(1)}% din total`}/>
      <KPI    label="Top mix gainer YoY"   value={dFmt(dTOD)}      subColor={dCol(dTOD)} sub={`Tratamente odontale · ${sTOD.toFixed(1)}%`}/>
      <KPI    label="Categorii active"     value="13"              sub="cu venituri non-zero"/>
    </div>

    {/* CFO Analysis — mix-aware framing */}
    <Card style={{marginBottom:16,background:'#FAFAFA',border:`1px solid #F0F0F0`}}>
      <Sec>Analiză Mix — {catPLabel} (pondere în cifra de afaceri totală)</Sec>
      <Pill type="green"><b>Implantologie + Protetică = {(sIMP+sPRO).toFixed(1)}%</b> din cifra de afaceri ({CAT_MONTHS[CIDX()]}) — cele două motoare comerciale ale rețelei. {CIDX()>=12 ? <span>Combinat, mix-ul a variat cu {(dIMP+dPRO)>0?'+':''}{(dIMP+dPRO).toFixed(1)}pp YoY (de la {(shPrev('IMP')+shPrev('PRO')).toFixed(1)}% la {(sIMP+sPRO).toFixed(1)}%) — {(dIMP+dPRO)<0?'semn că mix-ul se diversifică':'motoarele comerciale își consolidează ponderea'}.</span> : <span>Comparația YoY pe categorii este disponibilă din Apr 2026 — fereastra de date începe în Apr 25.</span>}</Pill>
      {CIDX()>=12 && <Pill type="green"><b>Tratamente odontale: {dFmt(dTOD)} pondere YoY</b> (de la {shPrev('TOD').toFixed(1)}% la {sTOD.toFixed(1)}%) — cel mai mare câștigător de mix. Endodonția la microscop urmează cu {dFmt(dEND)} ({sEND.toFixed(1)}%). Semnal pozitiv pe servicii core și complexitate crescută.</Pill>}
      <Pill type={dIMPmom < -2 ? 'amber' : 'green'}><b>Implantologie: pondere {dFmt(dIMP)} YoY</b> ({shPrev('IMP').toFixed(1)}% → {sIMP.toFixed(1)}%). Variație lunară de mix în {CAT_MONTHS[CIDX()]}: {dFmt(dIMPmom)} față de {CAT_MONTHS[CIDX()-1]} ({sIMPmar.toFixed(1)}%). Recomand verificare pipeline CT &amp; Plan Tratament pentru luna următoare.</Pill>
      <Pill type="green"><b>Estetică facială — categorie nouă (din Iul 2026):</b> mezoterapie, volumizare buze etc., realizată de medic dermatolog. {fmt(catVal('ESF',period))} în {catPLabel} ({shNow('ESF').toFixed(1)}% din mix) — segment tangențial dentar, cu potențial de creștere. Estetică (dentară + facială) + Consultații = {(sEST+sCON).toFixed(1)}% din mix.</Pill>
    </Card>

    {/* Two-column charts */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
      <Card>
        <Sec>Compoziție pe Categorii — {catPLabel}</Sec>

// ─── Comparative Tab ──────────────────────────────────────────────────────────
function ComparativeTab({period}) {
  // Helper: full year sum for a clinic/year
  const fy = (c, yr) => { const a=c.actuals?.[yr]; if(!a) return null; const v=a.filter(x=>x!=null); return v.length===12?sum(v):null; };
  // Full year 26 partial: sum only months available in 2026, compared to same months in 2025
  const fyPartial = (c) => {
    const a26=c.actuals?.[2026]; const a25=c.actuals?.[2025]; if(!a26||!a25) return null;
    const idx=a26.map((v,i)=>v!=null?i:-1).filter(i=>i>=0);
    if(!idx.length) return null;
    const s26=sum(idx.map(i=>a26[i])), s25=sum(idx.map(i=>a25[i]||0));
    return s25>0?gr(s26,s25):null;
  };
  const rows=Object.values(CD).map(c=>({
    ...c,
    v22:val(c,2022,period), v23:val(c,2023,period),
    v24:val(c,2024,period), v25:val(c,2025,period), v26:val(c,2026,period),
    bv:bval(c,2026,period),
    yoy2:gr(val(c,2024,period),val(c,2023,period)),
    yoy1:gr(val(c,2025,period),val(c,2024,period)),
    yoy:gr(val(c,2026,period),val(c,2025,period)),
    vsBgt:gr(val(c,2026,period),bval(c,2026,period)),
    fy2423:gr(fy(c,2024),fy(c,2023)),
    fy2524:gr(fy(c,2025),fy(c,2024)),
    hasAny2026:(c.actuals[2026]||[]).some(x=>x!=null),
  }));
  const n26=netv(period), n25=sum(period==='Month'?[NET.actuals[2025][ACT_MO-1]]:period==='YTD'?NET.actuals[2025].slice(0,ACT_MO):NET.actuals[2025].filter(x=>x!==null));
  const n24=sum(period==='Month'?[NET.actuals[2024][ACT_MO-1]]:period==='YTD'?NET.actuals[2024].slice(0,ACT_MO):NET.actuals[2024].filter(x=>x!==null));
  const n23=sum(period==='Month'?[NET.actuals[2023][ACT_MO-1]]:period==='YTD'?NET.actuals[2023].slice(0,ACT_MO):NET.actuals[2023].filter(x=>x!==null));
  const n22=sum(period==='Month'?[NET.actuals[2022][ACT_MO-1]]:period==='YTD'?NET.actuals[2022].slice(0,ACT_MO):NET.actuals[2022].filter(x=>x!==null));
  const nb=netb(period);
  // Full year network YoY
  const nFY25=sum(NET.actuals[2025].filter(x=>x!=null)), nFY24=sum(NET.actuals[2024].filter(x=>x!=null));
  const nFY23=sum(NET.actuals[2023].filter(x=>x!=null));
  const nFY2423=gr(nFY24,nFY23);
  const nFY2524=gr(nFY25,nFY24);
  const lfl26=LFL.reduce((a,c)=>a+(val(CD[c],2026,period)||0),0);
  const lfl25=LFL.reduce((a,c)=>a+(val(CD[c],2025,period)||0),0);
  const lfl24=LFL.reduce((a,c)=>a+(val(CD[c],2024,period)||0),0);
  const lfl23=LFL.reduce((a,c)=>a+(val(CD[c],2023,period)||0),0);
  const lflb=LFL.reduce((a,c)=>a+(bval(CD[c],2026,period)||0),0);
  // Full year LFL YoY
  const lflFY25=LFL.reduce((a,c)=>{ const v=CD[c].actuals?.[2025]; return a+(v&&v.filter(x=>x!=null).length===12?sum(v.filter(x=>x!=null)):0); },0);
  const lflFY24=LFL.reduce((a,c)=>{ const v=CD[c].actuals?.[2024]; return a+(v&&v.filter(x=>x!=null).length===12?sum(v.filter(x=>x!=null)):0); },0);
  const lflFY23=LFL.reduce((a,c)=>{ const v=CD[c].actuals?.[2023]; return a+(v&&v.filter(x=>x!=null).length===12?sum(v.filter(x=>x!=null)):0); },0);
  const lflFY2423=gr(lflFY24,lflFY23);
  const lflFY2524=gr(lflFY25,lflFY24);
  const bars=rows.filter(r=>r.hasAny2026);

  const clColor=num===1?P.primary:P.olive;
  const tot=(yr)=>codes.reduce((a,c)=>a+(val(CD[c],yr,period)||0),0);

  const tb=codes.reduce((a,c)=>a+(bval(CD[c],2026,period)||0),0);

    const v26=val(CD[c],2026,period)||0, v25=val(CD[c],2025,period)||0, v24=val(CD[c],2024,period);

      <div style={{textAlign:'right',borderLeft:`1px solid ${P.border}`,paddingLeft:22}}>

      {tb>0&&<KPI label="vs Budget" value={pct(gr(t26,tb))} subColor={pcol(gr(t26,tb))} sub={`Budget: ${fmt(tb)}`}/>}
      {tb>0&&<KPI label="Δ Actual vs Buget" value={(t26-tb>=0?'+':'')+fmt(t26-tb)} subColor={t26-tb>=0?'#15803D':P.alert} sub="RON" delta={t26-tb>=0}/>}

              <th key={i} style={{padding:'8px 12px',textAlign:i===0?'left':'right',fontWeight:700,color:P.primary,fontSize:11}}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((r,i)=>(
            <tr key={r.code} style={{borderBottom:`1px solid #F5F5F5`,background:i%2===0?P.white:'#FAFAFA'}}>

              <td style={{padding:'8px 12px',textAlign:'right',fontWeight:700}}>{fmt(r.v26)}</td>
              <td style={{padding:'8px 12px',textAlign:'right',fontWeight:700,color:pcol(r.yoy)}}>{pct(r.yoy)}</td>

// ─── Clinic Tab ───────────────────────────────────────────────────────────────
function ClinicTab({code,period}) {
  const c=CD[code];
  const v26=val(c,2026,period), v25=val(c,2025,period), v24=val(c,2024,period), bv=bval(c,2026,period);
  const yoy=gr(v26,v25), vb=gr(v26,bv);
  const years=Object.keys(c.actuals).map(Number).filter(y=>y>=2022).sort();
  const monthly=MONTHS.map((m,i)=>{const o={month:m};years.forEach(yr=>{o[yr]=(yr===2026 && i>=ACT_MO) ? null : (c.actuals[yr]?.[i]||null);});if(c.budget[2026])o['Bgt']=c.budget[2026]?.[i]||null;return o;});
  const annual=Object.keys(c.actuals).map(Number).filter(y=>y>=2020).sort().map(yr=>({year:`${yr}`,rev:sum(c.actuals[yr].filter(x=>x!==null))}));
  const gHist=[];
  const ay=Object.keys(c.actuals).map(Number).filter(y=>y>=2021).sort();
  const firstYear=ay[0];
  for(let i=1;i<ay.length;i++){
    const yr0=ay[i-1], yr1=ay[i];
    const arr0=c.actuals[yr0].filter(x=>x!==null);
    const arr1=c.actuals[yr1].filter(x=>x!==null);
    // Base year can be partial only if it's the clinic's opening year
    // Destination year must be complete (12 months)
    const baseOk = arr0.length===12 || yr0===firstYear;
    if(!baseOk || arr1.length<12) continue;
    const p=sum(arr0), cu=sum(arr1);
    if(p>0 && !(code==='GRG' && yr0===2021) && !(code==='SLB' && yr0===2023) && !(code==='DRB' && yr0===2023)) gHist.push({label:`${yr0}→${yr1}`,g:gr(cu,p),current:false});
  }
  // Add current 2026 vs 2025 (YTD/Month — partial, comparable)
  const cur26=val(c,2026,period), cur25=val(c,2025,period);
  if(cur26!=null && cur25!=null && cur25>0) {
    gHist.push({label:`2025→2026★`,g:gr(cur26,cur25),current:true});
  }
  const dy=years.slice(-5);
  const yc=['#E8D9CD','#dd7e6b','#C9A227','#B5BD5C',P.primary];

  return <div>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
      <div style={{background:P.primary,color:P.white,fontWeight:800,fontSize:14,borderRadius:8,padding:'7px 14px'}}>{c.code}</div>
      <div>
        <div style={{fontSize:18,fontWeight:700,color:P.primary,fontFamily:"'Playfair Display',serif"}}>{c.name}</div>
        <div style={{fontSize:11,color:P.muted}}>Cluster {c.cluster} · Activ din {Math.min(...Object.keys(c.actuals).map(Number))}</div>
      </div>
    </div>
    {v26==null && !bv && (
      <div style={{background:'#FFFBEB',border:`1px solid #FDE68A`,borderRadius:8,padding:'12px 16px',marginBottom:16,fontSize:12,color:'#92400E'}}>
        ⚡ Clinică în deschidere — actuals 2026 nu sunt încă disponibile. Bugetul va fi afișat odată ce datele sunt introduse.
      </div>
    )}
    {bv!=null && v26==null && (
      <div style={{background:'#FFFBEB',border:`1px solid #FDE68A`,borderRadius:8,padding:'12px 16px',marginBottom:16,fontSize:12,color:'#92400E'}}>
        ⚡ Clinică în deschidere 2026 — actuals nu sunt încă disponibile pentru perioada selectată. Buget alocat: <b>{fmt(bv)} RON</b>.
      </div>
    )}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(138px,1fr))',gap:12,marginBottom:16}}>
      <KPI hi label={pLabel(period)} value={fmt(v26)} sub="RON"/>
      {v24&&<KPI label="YoY vs 2024" value={pct0(gr(v26,v24))} subColor={pcol(gr(v26,v24))} sub={`2024: ${fmt(v24)}`}/>}
      <KPI label="YoY vs 2025" value={pct0(yoy)} subColor={pcol(yoy)} sub={`2025: ${fmt(v25)}`}/>
      {bv&&<KPI label="vs Budget" value={pct(vb)} subColor={pcol(vb)} sub={`Budget: ${fmt(bv)}`}/>}
      {bv&&v26!=null&&<KPI label="Δ Actual vs Budget" value={(v26-bv>=0?'+':'')+fmt(v26-bv)} subColor={v26-bv>=0?'#15803D':P.alert} sub="RON" delta={v26-bv>=0}/>}
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
      <Card>
        <Sec>Evoluție Lunară Multi-An</Sec>
        <ResponsiveContainer width="100%" height={210}>
          <LineChart data={monthly}>
            <CartesianGrid strokeDasharray="3 3" stroke="#F0F0F0" vertical={false}/>
            <XAxis dataKey="month" tick={{fontSize:11,fill:P.muted}} axisLine={false} tickLine={false}/>
            <YAxis tickFormatter={v=>fmt(v)} tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
            <Tooltip content={<Tip/>}/>
            {dy.map((yr,i)=><Line key={yr} type="monotone" dataKey={yr} stroke={yc[i]} strokeWidth={yr===2026?2.5:1.5} dot={yr===2026?{r:4,fill:P.primary,strokeWidth:0}:false} name={`${yr}`} connectNulls/>)}
            {c.budget[2026]&&<Line type="monotone" dataKey="Bgt" stroke={P.amber} strokeWidth={1.5} strokeDasharray="5 4" dot={false} name="Budget 2026" connectNulls/>}
          </LineChart>
        </ResponsiveContainer>
        <Legend items={[...dy.map((yr,i)=>[yc[i],`${yr}`]),...(c.budget[2026]?[[P.amber,'Budget 2026',true]]:[])]}/>
      </Card>
      <Card>
        <Sec>Vânzări Anuale</Sec>
        <ResponsiveContainer width="100%" height={210}>
          <BarChart data={annual} barCategoryGap="30%">
            <CartesianGrid strokeDasharray="3 3" stroke="#F0F0F0" vertical={false}/>
            <XAxis dataKey="year" tick={{fontSize:11,fill:P.muted}} axisLine={false} tickLine={false}/>
            <YAxis tickFormatter={v=>(v/1e6).toFixed(2)+'M'} tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
            <Tooltip content={<Tip/>}/>
            <Bar dataKey="rev" name="Revenue" radius={[4,4,0,0]}>
              {annual.map((d,i)=><Cell key={i} fill={d.year==='2026'?P.amber:i===annual.length-2?P.olive:P.primary}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </Card>
    </div>
    {gHist.length>0&&<Card>
      <Sec>Creștere YoY % — Istoric</Sec>
      <ResponsiveContainer width="100%" height={130}>
        <BarChart data={gHist} barCategoryGap="30%">
          <CartesianGrid strokeDasharray="3 3" stroke="#F0F0F0" vertical={false}/>
          <XAxis dataKey="label" tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
          <YAxis tickFormatter={v=>v+'%'} tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
          <Tooltip formatter={(v,n,p)=>[v.toFixed(1)+'%', p.payload.current?`YoY (${pLabel(period)})`:'YoY']}/>
          <ReferenceLine y={0} stroke={P.border} strokeWidth={1.5}/>
          <Bar dataKey="g" name="YoY" radius={[4,4,0,0]}>
            {gHist.map((e,i)=><Cell key={i} fill={e.current?(e.g>=0?P.primary:P.alert):(e.g>=0?P.olive:P.alert)}/>)}
          </Bar>
        </BarChart>
      </ResponsiveContainer>
      <div style={{fontSize:10,color:P.muted,marginTop:4}}>★ Perioadă curentă ({pLabel(period)}) — comparabil YoY</div>
    </Card>}
    <DataTable title={`Serii Istorice — ${c.name}`} rows={buildClinicDataRows(c)}/>
  </div>;
}


function App() {
  const [tab,setTab]=useState('overview');
  const [selMo,setSelMo]=useState(0);   // 0 = ultima luna cu date
  const [view,setView]=useState('YTD');

  ACT_MO = selMo || LAST_ACT;
  const period = view;
  return (
    <div style={{fontFamily:"'Poppins',sans-serif",background:P.bg,minHeight:'100vh',color:P.text}}>

      {/* Sticky header group: brand header + tabs + period toggle */}
      <div style={{position:'sticky',top:0,zIndex:10,background:P.bg,boxShadow:'0 4px 12px rgba(0,0,0,0.06)'}}>

        {/* Header */}
        <div style={{background:P.primary,padding:'18px 32px 16px',boxShadow:'0 2px 12px rgba(123,28,22,0.30)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:16}}>

            {/* Left — logo + brand identity */}
            <div style={{display:'flex',alignItems:'center',gap:20}}>
              <img src={LOGO_ADC} alt="Dr. Ardeleanu" style={{height:60,width:60,objectFit:'contain'}}/>
              <div style={{borderLeft:'1.5px solid rgba(255,255,255,0.22)',paddingLeft:20}}>
                <div style={{fontSize:11,fontWeight:600,color:P.wheat,letterSpacing:1.2,textTransform:'uppercase',marginBottom:3}}>Sales Performance Dashboard</div>
                <div style={{fontSize:20,fontWeight:700,color:P.white,letterSpacing:0.1,lineHeight:1,fontFamily:"'Playfair Display',serif"}}>Dr. Ardeleanu Dental Clinics</div>
                <div style={{fontSize:11,color:'rgba(255,255,255,0.55)',marginTop:4,fontStyle:'italic'}}>Excelența la prețuri accesibile. Clinica familiei tale.</div>
              </div>
            </div>

            {/* Right — brand KPIs */}
            <div style={{display:'flex',gap:24,alignItems:'center'}}>
              {[
                ['9','Clinici'],
                ['8','Orașe'],
                ['30K+','Pacienți/an'],
                ['4.9★','Google'],
              ].map(([val,lbl])=>(
                <div key={lbl} style={{textAlign:'center'}}>
                  <div style={{fontSize:18,fontWeight:800,color:P.white,lineHeight:1}}>{val}</div>
                  <div style={{fontSize:10,color:'rgba(255,255,255,0.55)',marginTop:3,letterSpacing:0.4,textTransform:'uppercase'}}>{lbl}</div>
                </div>
              ))}
              <div style={{borderLeft:'1.5px solid rgba(255,255,255,0.22)',paddingLeft:24,textAlign:'center'}}>
                <div style={{fontSize:13,fontWeight:700,color:P.wheat,letterSpacing:0.5}}>DIN 2017</div>
                <div style={{fontSize:10,color:'rgba(255,255,255,0.45)',marginTop:2}}>{'Ian–'+MONTHS[ACT_MO-1]+' 2026'}</div>
              </div>
            </div>

          </div>
        </div>

        {/* Tabs */}
        <div style={{background:P.white,borderBottom:`1px solid ${P.border}`,padding:'0 28px',display:'flex',gap:0,overflowX:'auto'}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              padding:'10px 15px',border:'none',background:'transparent',cursor:'pointer',
              fontSize:12,fontWeight:tab===t.id?700:500,
              color:tab===t.id?P.primary:P.muted,
              borderBottom:tab===t.id?`2.5px solid ${P.primary}`:'2.5px solid transparent',
              transition:'all 0.15s',whiteSpace:'nowrap',fontFamily:"'Poppins',sans-serif",
            }}>{t.label}</button>
          ))}
        </div>

        {/* Period toggle */}
        <div style={{background:P.white,borderBottom:`1px solid #F0F0F0`,padding:'9px 28px',display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:10,fontWeight:600,color:P.muted,marginRight:4,textTransform:'uppercase',letterSpacing:0.5}}>Perioadă</span>
          {MONTHS.slice(0, LAST_ACT).map((m,i)=>{ const mo=i+1; const on=ACT_MO===mo; return (
            <button key={m} onClick={()=>setSelMo(mo)} style={{
              padding:'5px 14px',borderRadius:20,border:'1.5px solid '+(on?P.primary:P.border),
              background:on?P.primary:P.white,color:on?P.white:P.text,
              fontWeight:600,fontSize:11,cursor:'pointer',fontFamily:"'Poppins',sans-serif",transition:'all 0.15s',
            }}>{m}</button>
          );})}
          <span style={{width:1,height:20,background:P.border,margin:'0 4px'}}></span>
          {[['Month','Lună'],['YTD','YTD']].map(([v,l])=>{ const on=view===v; return (
            <button key={v} onClick={()=>setView(v)} style={{
              padding:'5px 14px',borderRadius:20,border:'1.5px solid '+(on?P.primary:P.border),
              background:on?P.primary:P.white,color:on?P.white:P.text,
              fontWeight:700,fontSize:11,cursor:'pointer',fontFamily:"'Poppins',sans-serif",transition:'all 0.15s',
            }}>{l}</button>
          );})}
          <span style={{fontSize:11,fontWeight:600,color:P.muted,marginLeft:8}}>{pLabel(period)}</span>
        </div>

      </div>

      {/* Content */}
      <div style={{padding:'20px 28px',maxWidth:1280,margin:'0 auto'}}>
        {tab==='overview'    && <NetworkTab period={period}/>}
        {tab==='category'    && <CategoryTab period={period}/>}
        {tab==='comparative' && <ComparativeTab period={period}/>}
        {tab==='rampup'      && <RampupTab/>}
        {tab==='cluster1'    && <ClusterTab num={1} period={period}/>}
        {tab==='cluster2'    && <ClusterTab num={2} period={period}/>}
        {Object.keys(CD).includes(tab) && <ClinicTab code={tab} period={period}/>}
      </div>

      {/* Footer */}
      <div style={{padding:'13px 28px',display:'flex',justifyContent:'space-between',alignItems:'center',background:P.primary,marginTop:20}}>
        <div style={{fontSize:11,color:'rgba(255,255,255,0.65)'}}>© Dr. Ardeleanu Dental Clinics · clinicileardeleanu.ro · 031 99 63</div>
        <div style={{fontSize:11,color:P.wheat,fontWeight:600}}>Din 2017</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
