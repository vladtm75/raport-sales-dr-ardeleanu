<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Raport Vânzări — Dr. Ardeleanu Dental Clinics</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#F5EDE3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#FFFFFF;border-radius:16px;box-shadow:0 8px 40px rgba(123,28,22,0.12);padding:44px 36px;max-width:420px;width:100%;text-align:center;border-top:6px solid #7B1C16}
.card img{max-width:240px;width:80%;height:auto;margin-bottom:22px}
h1{font-size:22px;font-weight:800;color:#7B1C16;margin-bottom:4px}
.sub{font-size:13px;font-weight:500;color:#C9A227;margin-bottom:26px;letter-spacing:0.5px}
input{width:100%;padding:13px 16px;border:1.5px solid #EBEBEB;border-radius:10px;font-family:'Poppins',sans-serif;font-size:15px;text-align:center;outline:none;transition:border .2s}
input:focus{border-color:#7B1C16}
button{width:100%;margin-top:14px;padding:13px;border:none;border-radius:10px;background:#7B1C16;color:#fff;font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s}
button:hover{background:#5e150f}
#err{color:#D93025;font-size:13px;margin-top:12px;min-height:18px;font-weight:500}
footer{margin-top:28px;font-size:12px;color:#888;font-weight:300}
footer b{color:#7B1C16;font-weight:500}
</style>
</head>
<body>
<div class="card">
<img src="logo.png" alt="Dr. Ardeleanu Dental Clinics">
<h1>Raport Vânzări</h1>
<div class="sub">IULIE 2026 · ACCES RESTRICȚIONAT</div>
<input type="password" id="pw" placeholder="Introdu parola" autofocus>
<button id="go">Accesează raportul</button>
<div id="err"></div>
</div>
<footer><b>Din 2017</b> · © Dr. Ardeleanu Dental Clinics · clinicileardeleanu.ro</footer>
<script>
const HASH='fb8837bf1fde6bb35a4df3789b02036378d368b73bba19ead085687f84a4ddb0';
function dest(){
  const p=new URLSearchParams(location.search).get('to');
  if(p==='desktop')return 'desktop.html';
  if(p==='mobile')return 'mobile.html';
  const m=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||window.innerWidth<768;
  return m?'mobile.html':'desktop.html';
}
if(sessionStorage.getItem('drard_auth')==='ok'){location.replace(dest());}
async function check(){
  const v=document.getElementById('pw').value;
  if(!v)return;
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  const h=Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  if(h===HASH){sessionStorage.setItem('drard_auth','ok');location.replace(dest());}
  else{document.getElementById('err').textContent='Parolă incorectă. Încearcă din nou.';document.getElementById('pw').value='';}
}
document.getElementById('go').addEventListener('click',check);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')check();});
</script>
</body>
</html>
