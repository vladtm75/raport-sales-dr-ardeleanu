<h1>Raport Vânzări</h1>
<div class="sub">IULIE 2026 · ACCES RESTRICȚIONAT</div>

<script>
const HASH='fb8837bf1fde6bb35a4df3789b02036378d368b73bba19ead085687f84a4ddb0';
function dest(){
  const p=new URLSearchParams(location.search).get('to');
  if(p==='desktop')return 'desktop.html';
  if(p==='mobile')return 'mobile.html';
  const m=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||window.innerWidth<768;
  return m?'mobile.html':'desktop.html';
}
if(sessionStorage.getItem('drard_auth')==='ok'){location.replace(dest());}
async function check(){
  const v=document.getElementById('pw').value;
  if(!v)return;
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  const h=Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  if(h===HASH){sessionStorage.setItem('drard_auth','ok');location.replace(dest());}
  else{document.getElementById('err').textContent='Parolă incorectă. Încearcă din nou.';document.getElementById('pw').value='';}
}
document.getElementById('go').addEventListener('click',check);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')check();});
</script>
